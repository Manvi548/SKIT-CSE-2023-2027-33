<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EmotionSense AI | Analysis</title>

    <link rel="stylesheet"
          href="../css/components.css">
</head>

<body>

<div class="container">

<header>

    <div class="logo">
        <div class="logo-icon">😊</div>
        EmotionSense AI
    </div>

    <nav>
        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="analysis.html"
           class="active">
            Analysis
        </a>

        <a href="history.html">
            History
        </a>

        <a href="about.html">
            About
        </a>
    </nav>

</header>


<main>

<section style="padding:50px 0 30px;">

    <h1>Emotion Analysis</h1>

    <p style="
        color:#8d96ad;
        margin-top:10px;
    ">
        Use the camera or upload an image
        for analysis.
    </p>

</section>


<div class="card">

    <div class="card-title">
        <h2>Input Source</h2>
        <span>Camera / Image</span>
    </div>


    <div class="camera-area">

        <div class="camera-placeholder">

            <div class="camera-icon">
                📷
            </div>

            <h3>Camera Ready</h3>

            <p>
                Start camera to begin detection
            </p>

        </div>

    </div>


    <div class="camera-controls">

        <button class="primary-btn">
            Start Camera
        </button>

        <button class="secondary-btn">
            Upload Image
        </button>

        <button class="secondary-btn">
            Analyze
        </button>

    </div>

</div>

</main>

</div>

</body>
</html>
