<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EmotionSense AI | History</title>

    <link rel="stylesheet"
          href="../css/components.css">
</head>

<body>

<div class="container">

<header>

    <div class="logo">
        <div class="logo-icon">😊</div>
        EmotionSense AI
    </div>

    <nav>
        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="analysis.html">
            Analysis
        </a>

        <a href="history.html"
           class="active">
            History
        </a>

        <a href="about.html">
            About
        </a>
    </nav>

</header>


<main>

<section style="padding:50px 0 30px;">

    <h1>Analysis History</h1>

    <p style="
        color:#8d96ad;
        margin-top:10px;
    ">
        View previous emotion analysis results.
    </p>

</section>


<div class="card">

    <div class="card-title">
        <h2>Recent Analyses</h2>
        <span>Results</span>
    </div>


    <div style="overflow-x:auto;">

        <table style="
            width:100%;
            border-collapse:collapse;
        ">

            <thead>

            <tr>

                <th style="
                    text-align:left;
                    padding:14px;
                    color:#8d96ad;
                ">
                    Time
                </th>

                <th style="
                    text-align:left;
                    padding:14px;
                    color:#8d96ad;
                ">
                    Emotion
                </th>

                <th style="
                    text-align:left;
                    padding:14px;
                    color:#8d96ad;
                ">
                    Confidence
                </th>

                <th style="
                    text-align:left;
                    padding:14px;
                    color:#8d96ad;
                ">
                    Status
                </th>

            </tr>

            </thead>


            <tbody id="historyBody">

            <tr>

                <td style="padding:14px;">
                    Today
                </td>

                <td style="padding:14px;">
                    😊 Happy
                </td>

                <td style="padding:14px;">
                    94%
                </td>

                <td style="padding:14px;">
                    Completed
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</main>

</div>

</body>
</html>
